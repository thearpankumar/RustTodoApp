[package]
name = "todo_app"
version = "3.0.0"
edition = "2021"
license = "MIT"
authors = ["thearpankumar <arpankumar1119@outlook.com>"]
description = "Projects, tasks and a notes canvas, one keystroke away."

[package.metadata.generate-rpm]
# The tray needs an AppIndicator host; without one the app still runs, so this
# is a recommendation rather than a hard requirement.
requires = { gtk3 = "*" }
assets = [
    { source = "target/release/todo_app", dest = "/usr/bin/todo_app", mode = "755" },
    { source = "packaging/linux/todo_app.desktop", dest = "/usr/share/applications/todo_app.desktop", mode = "644" },
    { source = "assets/icon.png", dest = "/usr/share/pixmaps/todo_app.png", mode = "644" },
    { source = "assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/todo_app.svg", mode = "644" },
    { source = "scripts/install-hotkey-linux.sh", dest = "/usr/share/todo_app/install-hotkey-linux.sh", mode = "755" },
    { source = "assets/icons/16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/24x24.png", dest = "/usr/share/icons/hicolor/24x24/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/todo_app.png", mode = "644" },
    { source = "assets/icons/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/todo_app.png", mode = "644" },
]

# The WiX source lives at wix/main.wxs and is committed. It is NOT generated by
# `cargo wix init`, which would drop the Start menu shortcut; the product icon is
# declared directly in that file.

[dependencies]
eframe = { version = "0.33.3", features = ["persistence"] }
egui = "0.33.3"
egui_material_icons = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
whoami = "2.0.2"
chrono = "0.4"
egui_commonmark = "0.22"
serde_json = "1.0"
global-hotkey = "0.8"
tray-icon = "0.24"
auto-launch = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

# Metadata for cargo-deb so the workflow can produce a .deb
[package.metadata.deb]
name = "todo-app"
maintainer = "thearpankumar <arpankumar1119@outlook.com>"
# $auto picks up the real shared-library dependencies (OpenGL, xkbcommon,
# wayland, ...) instead of the single hand-written libc6 guess. The extras are
# what the tray icon needs at runtime.
depends = "$auto, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1"
section = "utils"
priority = "optional"
assets = [
    # Installed as todo_app, not todo-app: the desktop entry's Exec= and the
    # hotkey script both invoke `todo_app`.
    ["target/release/todo_app", "/usr/bin/todo_app", "755"],
    ["packaging/linux/todo_app.desktop", "/usr/share/applications/todo_app.desktop", "644"],
    ["assets/icon.png", "/usr/share/pixmaps/todo_app.png", "644"],
    ["assets/logo.svg", "/usr/share/icons/hicolor/scalable/apps/todo_app.svg", "644"],
    # Wayland cannot let an app grab keys, so packaged users need this script.
    ["scripts/install-hotkey-linux.sh", "/usr/share/todo_app/install-hotkey-linux.sh", "755"],
    ["assets/icons/16x16.png", "/usr/share/icons/hicolor/16x16/apps/todo_app.png", "644"],
    ["assets/icons/24x24.png", "/usr/share/icons/hicolor/24x24/apps/todo_app.png", "644"],
    ["assets/icons/32x32.png", "/usr/share/icons/hicolor/32x32/apps/todo_app.png", "644"],
    ["assets/icons/48x48.png", "/usr/share/icons/hicolor/48x48/apps/todo_app.png", "644"],
    ["assets/icons/64x64.png", "/usr/share/icons/hicolor/64x64/apps/todo_app.png", "644"],
    ["assets/icons/128x128.png", "/usr/share/icons/hicolor/128x128/apps/todo_app.png", "644"],
    ["assets/icons/256x256.png", "/usr/share/icons/hicolor/256x256/apps/todo_app.png", "644"],
    ["assets/icons/512x512.png", "/usr/share/icons/hicolor/512x512/apps/todo_app.png", "644"],
]

[workspace]
members = ["xtask"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Lets the app take the window handle straight from eframe instead of hunting
# for it by title. Pinned to the version eframe itself uses so the handle types
# are the same ones.
raw-window-handle = "0.6.2"
