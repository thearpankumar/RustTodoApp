name: Build and Release (tag)

on:
  push:
    tags:
      - '**'

jobs:
  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: "Automatic release for tag ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # libgtk-3-dev / libayatana-appindicator3-dev / libxdo-dev are needed to
          # build the tray icon. libfuse2 was renamed on Ubuntu 24.04, so accept
          # either name rather than failing the whole job.
          sudo apt-get install -y file libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - uses: Swatinem/rust-cache@v2

      - name: Install Packaging Tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build (Release)
        run: cargo build --release

      - name: Create .deb
        run: |
          mkdir -p release_artifacts
          cargo deb -p todo_app
          cp target/debian/*.deb release_artifacts/

      - name: Create .rpm
        run: |
          mkdir -p release_artifacts
          cargo generate-rpm
          cp target/generate-rpm/*.rpm release_artifacts/

      - name: Create AppImage
        run: |
          mkdir -p release_artifacts

          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

          # The icon basename has to match Icon= in the desktop entry.
          cp assets/icons/256x256.png todo_app.png

          mkdir -p AppDir/usr/bin
          cp target/release/todo_app AppDir/usr/bin/

          ./linuxdeploy \
            --appdir AppDir \
            --output appimage \
            --icon-file todo_app.png \
            --desktop-file packaging/linux/todo_app.desktop

          mv ./*.AppImage release_artifacts/todo_app-${{ github.ref_name }}-x86_64.AppImage

      - name: Create Generic .tar.gz
        run: |
          tar -czf release_artifacts/todo_app-${{ github.ref_name }}-linux-generic.tar.gz \
            -C target/release todo_app

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.deb
            release_artifacts/*.rpm
            release_artifacts/*.AppImage
            release_artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    needs: create_release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (Release)
        shell: pwsh
        run: cargo build --release

      - name: Create .zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_artifacts -Force | Out-Null
          Compress-Archive -Path target\release\todo_app.exe `
            -DestinationPath release_artifacts\todo_app-${{ github.ref_name }}-windows.zip -Force

      - name: Create .msi
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          # No `cargo wix init` here on purpose: it would overwrite the committed
          # wix\main.wxs, which is the only thing that adds the Start menu entry.
          cargo wix -p todo_app --nocapture
          Copy-Item (Get-ChildItem target\wix\*.msi | Select-Object -First 1).FullName `
            -Destination release_artifacts

      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.zip
            release_artifacts/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS
    needs: create_release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output todo_app \
            target/aarch64-apple-darwin/release/todo_app \
            target/x86_64-apple-darwin/release/todo_app
          lipo -info todo_app

      - name: Build .app bundle
        run: |
          # Info.plist wants a plain version; tags are usually prefixed with v.
          VERSION="${GITHUB_REF_NAME#v}"

          APP="Todo App.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp todo_app "$APP/Contents/MacOS/todo_app"
          chmod +x "$APP/Contents/MacOS/todo_app"
          # CFBundleIconFile is AppIcon, and it must be a real .icns.
          cp assets/icon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          plutil -lint "$APP/Contents/Info.plist"

      - name: Create .dmg and .tar.gz
        run: |
          mkdir -p release_artifacts dmg
          cp -R "Todo App.app" dmg/
          ln -s /Applications dmg/Applications

          hdiutil create \
            -volname "Todo App" \
            -srcfolder dmg \
            -ov -format UDZO \
            "release_artifacts/todo_app-${{ github.ref_name }}-macos.dmg"

          tar -czf "release_artifacts/todo_app-${{ github.ref_name }}-macos.tar.gz" "Todo App.app"

      - name: Upload macOS Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*.dmg
            release_artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
